name: publish

# One tag is the whole release: `git push origin v0.1.1` runs the tests, publishes
# to npm with provenance, and creates the GitHub release with the tarball attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and attach the tarball
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The tag is the version: `v0.1.1` must publish `0.1.1`, or the registry and
      # the release drift apart silently.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match package.json '$version'"
            exit 1
          fi

      - name: Ensure the registry token is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm access token as the NPM_TOKEN repository secret"
            exit 1
          fi

      - name: Run tests before publishing
        run: npm test

      - name: Build the tarball
        run: npm pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A release created with GITHUB_TOKEN does not re-trigger workflows, which is
      # exactly why publishing and releasing live in the same job instead of two.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tgz --clobber
          else
            gh release create "$tag" ./*.tgz \
              --title "dsh-pair ${tag#v}" \
              --generate-notes
          fi
