name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no runtime dependencies, so there is nothing to install:
      # the suites boot a real `node:http` server with the fakes in test/harness.js.
      - name: Run tests
        run: npm test

      - name: Check the tarball would be publishable
        run: npm pack --dry-run

  tarball:
    name: tarball
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pair-tgz
          path: '*.tgz'
          if-no-files-found: error
