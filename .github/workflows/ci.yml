name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no runtime dependencies, so there is nothing to install:
      # the suites boot a real `node:http` server with the fakes in test/harness.js.
      - name: Run tests
        run: npm test

      - name: Check the tarball would be publishable
        run: npm pack --dry-run

